version: "3.7"

services:
  app_proxy:
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_HOST: strapi_web_1
      APP_PORT: 1337
      # Strapi manages its own admin authentication — no Umbrel proxy auth needed
      PROXY_AUTH_ADD: "false"

  web:
    # After your first `docker buildx build` + push, replace the tag and add:
    #   @sha256:<digest>
    # to pin the image for reproducible installs.
    image: ghcr.io/nickchampion/strapi-umbrelos:v1.0.13@sha256:5c362b348bd2b7871bde8b355fe049131ae32d3a147547b98f5d3e119ce38d59
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/opt/app/public/uploads
      - ${APP_DATA_DIR}/src:/opt/app/src
    environment:
      HOST: "0.0.0.0"
      PORT: "1337"
      NODE_ENV: production
      PUBLIC_URL: "http://${APP_DOMAIN}:1337"
      STRAPI_TELEMETRY_DISABLED: "true"

      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi_db_1
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${APP_STRAPI_DB_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_SCHEMA: public

      # Email (SMTP) — configured via scripts/configure-smtp.sh, persisted in APP_DATA_DIR
      SMTP_HOST: ${APP_STRAPI_SMTP_HOST}
      SMTP_PORT: ${APP_STRAPI_SMTP_PORT}
      SMTP_USERNAME: ${APP_STRAPI_SMTP_USERNAME}
      SMTP_PASSWORD: ${APP_STRAPI_SMTP_PASSWORD}
      SMTP_FROM: ${APP_STRAPI_SMTP_FROM}
      SMTP_REPLY_TO: ${APP_STRAPI_SMTP_REPLY_TO}

      # Security secrets (derived deterministically from APP_SEED via exports.sh)
      APP_KEYS: ${APP_STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${APP_STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${APP_STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${APP_STRAPI_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${APP_STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${APP_STRAPI_ENCRYPTION_KEY}

  db:
    # Pin to SHA256 digest before app store submission.
    # Get the current digest: docker pull postgres:16-alpine && docker inspect postgres:16-alpine --format='{{index .RepoDigests 0}}'
    image: postgres:16-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${APP_STRAPI_DB_PASSWORD}
      POSTGRES_DB: strapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
