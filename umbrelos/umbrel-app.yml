name: Strapi
version: "5.0.26"
tagline: The Open-Source Headless CMS for AI powered Websites and Apps
description: >-
  Strapi is the leading open-source headless CMS, giving you full control
  over your content and APIs without locking you into any frontend framework.
  Build blogs, e-commerce backends, mobile app APIs, or enterprise content
  platforms — all from a single self-hosted instance.

  The intuitive admin panel lets editors create and manage content types,
  media, and permissions without writing code. Developers get auto-generated
  REST and GraphQL APIs, role-based access control, webhooks, and full
  TypeScript support out of the box.

  Strapi v5 introduces the Document Service API for improved content
  management, a redesigned admin interface, enhanced plugin architecture,
  and better performance across the board.

  This package includes two custom built-in plugins. The Email plugin (Settings →
  Email) lets you configure outbound SMTP so Strapi can send password-reset
  and notification emails — enter your SMTP host, port, credentials, and
  from address, then use the built-in test tool to verify delivery. The Run
  Mode plugin (Settings → Run Mode) lets you switch between Development mode
  — where the Content-Type Builder is available so you can create and modify
  content types — and Production mode, which locks the schema and serves
  your API with lower overhead. Start in Development, build your content
  model, then switch to Production when you're ready to go live.

  All app data — your PostgreSQL database, uploaded media, and content type
  schemas — is stored in Umbrel's app-data directory and is automatically
  included in UmbrelOS backups (Settings → Backups). To migrate or take a
  manual snapshot, stop the app and copy the app-data/strapi/ directory;
  restore by stopping the app, replacing the directory, and restarting.

  ⚠️ On first launch, visit the admin panel to create your administrator
  account. Your Strapi API will be available at http://umbrel.local:1337/api
  and the admin panel at http://umbrel.local:1337/admin.
